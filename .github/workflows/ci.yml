name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java for Firestore emulator tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install deterministic dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Firestore Rules tests
        run: npm run test:rules

      - name: Production build

  run: npx next build --webpack

  env:

    NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyBQbW1XLDOGq4zz6ZEUSo9X18enKK60Mms
NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=proveit-internal.firebaseapp.com
NEXT_PUBLIC_FIREBASE_PROJECT_ID=proveit-internal
NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=proveit-internal.firebasestorage.app
NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=929249851815
NEXT_PUBLIC_FIREBASE_APP_ID=1:929249851815:web:3eafd7102ed7ff89e91e82
      - name: Check generated changes
        run: git diff --check
